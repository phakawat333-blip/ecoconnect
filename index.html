<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoConnect by Kru Phakawat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap');
        
        :root {
            --primary: #2b5876; --secondary: #4e4376; --accent: #00e676; --danger: #ff1744; --warning: #ffea00;
            --glass-bg: rgba(255, 255, 255, 0.85); --glass-border: rgba(255, 255, 255, 0.3);
        }

        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        
        body { 
            margin: 0; display: flex; flex-direction: column; height: 100vh; 
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            overflow: hidden; user-select: none; -webkit-user-select: none; color: #333;
        }

        /* App Header & Status */
        .app-header { 
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px); color: white; 
            padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 20; border-bottom: 1px solid var(--glass-border);
        }
        .app-header h1 { margin: 0; font-size: 1.5em; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .creator-info { text-align: right; line-height: 1.2; }
        .creator { font-weight: bold; color: var(--accent); font-size: 1.1em; }
        .school { font-size: 0.8em; opacity: 0.9; }

        #status-bar {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            background: var(--glass-bg); padding: 10px 25px; border-radius: 30px;
            font-weight: bold; font-size: 1.2em; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 15; border: 2px solid #ccc; transition: all 0.3s; display: flex; align-items: center; gap: 10px;
        }
        .status-chain { border-color: #29b6f6 !important; color: #0277bd; }
        .status-web { border-color: #ab47bc !important; color: #6a1b9a; }

        .main-container { display: flex; flex-grow: 1; overflow: hidden; position: relative; }

        /* Sidebar */
        #sidebar { 
            width: 320px; background: var(--glass-bg); backdrop-filter: blur(15px);
            display: flex; flex-direction: column; z-index: 10; box-shadow: 5px 0 15px rgba(0,0,0,0.1); 
            border-right: 1px solid var(--glass-border);
        }
        .sidebar-header { padding: 15px; background: rgba(0,0,0,0.05); text-align: center; border-bottom: 1px solid #ddd; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #aaa; font-size: 1em; outline: none; cursor: pointer; font-weight: bold; }
        .alien-btn { margin-top: 10px; width: 100%; padding: 10px; background: #6200ea; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .alien-btn:hover { background: #3700b3; box-shadow: 0 0 15px #6200ea; }

        #organism-list { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .organism-item { 
            padding: 12px; border: 1px solid #ddd; border-radius: 10px; cursor: pointer; 
            background: white; display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .organism-item:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 5px 10px rgba(0,0,0,0.15); }
        .org-icon { font-size: 1.5em; margin-right: 10px; }
        .org-name { flex-grow: 1; font-weight: 600; }
        .type-tag { font-size: 0.75em; padding: 4px 8px; border-radius: 20px; color: white; font-weight: bold; }
        .tag-p { background: #43a047; } .tag-c { background: #f57c00; } .tag-a { background: #d50000; box-shadow: 0 0 8px red;}

        /* Workspace & Nodes */
        #workspace { 
            flex-grow: 1; position: relative; background-color: #fce4ec; 
            background-image: radial-gradient(rgba(0,0,0,0.05) 2px, transparent 2px); 
            background-size: 30px 30px; overflow: hidden; touch-action: none; cursor: grab;
        }
        #workspace:active { cursor: grabbing; }
        
        .zoom-panel {
            position: absolute; top: 20px; right: 20px; background: var(--glass-bg);
            padding: 8px 12px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 50; display: flex; align-items: center; gap: 10px; border: 1px solid #ddd;
        }
        .zoom-btn { background: white; border: 1px solid #bbb; border-radius: 6px; width: 30px; height: 30px; font-weight: bold; font-size: 1.2em; cursor: pointer; transition: 0.2s; }
        .zoom-btn:hover { background: #eee; }
        .zoom-btn:active { transform: scale(0.9); }
        .zoom-text { font-weight: bold; min-width: 50px; text-align: center; }

        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: top left; transition: transform 0.05s linear; }

        .node { 
            position: absolute; width: 230px; background: rgba(255, 255, 255, 0.95); 
            border: 2px solid #aaa; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: box-shadow 0.2s, border-color 0.2s; z-index: 5; display: flex; flex-direction: column;
            cursor: grab; backdrop-filter: blur(5px);
        }
        .node:active { cursor: grabbing; box-shadow: 0 15px 35px rgba(0,0,0,0.4); z-index: 1000 !important; }
        .node.alien-node { border-color: #d50000; box-shadow: 0 0 20px rgba(213, 0, 0, 0.4); }
        .delete-btn { position: absolute; top: -10px; right: -10px; background: var(--danger); color: white; border: 2px solid white; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-weight: bold; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 10; }
        
        .node-content { padding: 15px; pointer-events: none; } 
        .node-content button, .node-content input { pointer-events: auto; } 
        .node-header { display: flex; align-items: center; margin-bottom: 5px; justify-content: center;}
        .node-header .icon { font-size: 1.8em; margin-right: 5px; }
        .node .name { font-weight: bold; font-size: 1.2em; color: #222; }
        .node .role { font-size: 0.8em; text-align: center; margin-bottom: 5px; font-weight: bold; background: #eee; padding: 3px; border-radius: 5px; }
        
        .pop-controls { display: flex; justify-content: space-between; align-items: center; background: #f0f0f0; border-radius: 8px; padding: 4px; margin-bottom: 10px; pointer-events: auto; border: 1px solid #ddd;}
        .pop-btn { background: white; border: 1px solid #ccc; border-radius: 5px; width: 25px; height: 25px; cursor: pointer; font-weight: bold; font-size: 1.1em; display: flex; align-items: center; justify-content: center; color: #333; transition: 0.2s;}
        .pop-btn:hover { background: #e0e0e0; }
        .pop-btn.decrease { color: var(--danger); }
        .pop-btn.increase { color: #43a047; }
        
        .pop-input { 
            width: 80px; text-align: center; border: 1px solid #ccc; border-radius: 5px; 
            font-weight: bold; font-family: inherit; font-size: 0.9em; padding: 2px 5px;
            outline: none; transition: 0.2s; background: white; color: #111;
        }
        .pop-input:focus { border-color: var(--primary); box-shadow: 0 0 5px rgba(43, 88, 118, 0.5); }
        .pop-input::-webkit-outer-spin-button, .pop-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .pop-input[type=number] { -moz-appearance: textfield; }

        .lvl-p { background: #e8f5e9 !important; color: #2e7d32; }
        .lvl-c1 { background: #fff3e0 !important; color: #ef6c00; }
        .lvl-c2 { background: #ffebee !important; color: #c62828; }
        .lvl-c3 { background: #f3e5f5 !important; color: #6a1b9a; }
        .lvl-extinct { background: #eceff1 !important; color: #546e7a; text-decoration: line-through; }

        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.7em; background: #f9f9f9; padding: 8px; border-radius: 8px; border: 1px solid #eee; }
        .data-item { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .data-label { color: #777; font-size: 0.9em; }
        .data-val { font-weight: bold; font-size: 1.1em; }
        .val-energy { color: #0277bd; } .val-heat { color: #e65100; } .val-mass { color: #558b2f; }

        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
        .link-line { stroke: rgba(100,100,100,0.6); stroke-width: 4; marker-end: url(#arrowhead); }
        .link-flow { stroke: var(--warning); stroke-width: 2; stroke-dasharray: 10; animation: flow 1s linear infinite; }
        @keyframes flow { to { stroke-dashoffset: -20; } }

        /* Action Panel */
        .control-panel { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; z-index: 50; }
        button.action-btn { padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.2s; font-size: 0.9em; display: flex; align-items: center; gap: 5px; }
        .btn-sim { background: #2962ff; color: white; } .btn-sim:hover { background: #1565c0; }
        .btn-graph { background: #aa00ff; color: white; } .btn-graph:hover { background: #6a1b9a; }
        .btn-pyramid { background: #ff9100; color: white; } .btn-pyramid:hover { background: #ff6d00; }
        .btn-pdf { background: #00c853; color: white; } .btn-pdf:hover { background: #009624; }
        .btn-reset { background: var(--danger); color: white; } .btn-reset:hover { background: #b71c1c; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 85%; max-width: 900px; text-align: center; position: relative; max-height: 90vh; overflow-y: auto;}
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 2em; cursor: pointer; color: #555; }
        
        .pyramid-container { display: flex; justify-content: space-around; flex-wrap: wrap; margin-top: 20px; gap: 20px; }
        .pyramid-box { flex: 1; min-width: 320px; background: #f5f5f5; padding: 15px; border-radius: 10px; }
        
        #graph-container { width: 100%; height: 400px; margin-top: 20px; }
        
        /* Time Display */
        #time-display { position: absolute; top: 20px; left: 340px; background: rgba(0,0,0,0.6); color: white; padding: 8px 15px; border-radius: 8px; font-weight: bold; z-index: 15; font-size: 1.2em;}

        /* Report Area */
        #report-area { display: none; background: white; padding: 20mm; color: black;
